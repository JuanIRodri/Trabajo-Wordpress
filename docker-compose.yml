services:
  db:
    image: mysql:8.0.36
    container_name: wp_db_fijo
    restart: always
    command: --default-authentication-plugin=mysql_native_password  # <-- Fix principal
    environment:
      MYSQL_ROOT_PASSWORD: tu_password_maestro
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: natalia
      MYSQL_PASSWORD: Chucherias#!
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:                          # <-- WordPress espera a que DB esté lista
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  wordpress:
    depends_on:
      db:
        condition: service_healthy        # <-- Espera el healthcheck, no solo que arranque
    image: wordpress:6.4.3-php8.2-apache
    container_name: wp_site_fijo
    ports:
      - "8080:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: natalia
      WORDPRESS_DB_PASSWORD: Chucherias#!
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wp-content:/var/www/html/wp-content

volumes:
  db_data:
