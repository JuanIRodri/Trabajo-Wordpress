version: '3.8'

services:
  db:
    image: mysql:8.0.36
    container_name: wp_db_fijo
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: tu_password_maestro
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: natalia
      MYSQL_PASSWORD: Chucherias#!
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  wordpress:
    depends_on:
      db:
        condition: service_healthy
    build: .
    container_name: wp_site_fijo
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: natalia
      WORDPRESS_DB_PASSWORD: Chucherias#!
      WORDPRESS_DEBUG: 1
    volumes:
      - ./wp-content:/var/www/html/wp-content

  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy
    restart: always
    ports:
      - '80:80'   
      - '443:443' 
      - '81:81'  
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt

volumes:
  db_data:
